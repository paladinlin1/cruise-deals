name: 擷取郵輪 Last Minute Deals

on:
  schedule:
    # UTC 21:00 = 台北時間隔日 05:00
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "要擷取的來源（逗號分隔，留空為全部）"
        required: false
        default: ""

# 需要寫入權限才能把結果 commit 回 repo
permissions:
  contents: write

concurrency:
  # 同時只跑一個，避免兩次執行互相覆蓋 data/
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # secrets 不能直接用在 step 的 if 條件，先搬到 env 才能判斷有沒有設定
    env:
      ROUTER_HOST: ${{ secrets.ROUTER_HOST }}
      ROUTER_SSH_USER: ${{ secrets.ROUTER_SSH_USER }}
      ROUTER_SSH_PORT: ${{ secrets.ROUTER_SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝相依套件
        run: pip install -e ".[dev,browser]"

      - name: 安裝 Chromium（Expedia 用）
        run: patchright install --with-deps chromium

      - name: 安裝 xvfb（cruisedirect 用）
        # SeleniumBase 的 UC/CDP 模式在無頭下過不了 Cloudflare，
        # 需要 xvfb 提供虛擬顯示，讓它以「有頭」方式執行。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: 執行測試
        # 解析器測試跑在存下來的 HTML 上，能在真正擷取前先抓出程式錯誤
        run: pytest -q

      - name: 建立 SSH SOCKS5 通道
        # cruisedirect 的 Cloudflare 對資料中心 IP 會出人工勾選框（實測點了也不過），
        # 但住宅 IP 會自動放行。把流量導過家用路由器即可。
        # 沒設定 ROUTER_* secrets 時整步跳過，cruisedirect 就直連並如常降級。
        id: tunnel
        if: env.ROUTER_HOST != ''
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ROUTER_SSH_KEY }}" > ~/.ssh/id_tunnel
          chmod 600 ~/.ssh/id_tunnel

          if [ -n "${{ secrets.ROUTER_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.ROUTER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            HOST_KEY_OPT="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::未設定 ROUTER_KNOWN_HOSTS，改用 TOFU 模式（建議補上以防中間人攻擊）"
            HOST_KEY_OPT="-o StrictHostKeyChecking=accept-new"
          fi

          ssh -f -N -D 1080 -i ~/.ssh/id_tunnel \
              $HOST_KEY_OPT \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=30 \
              -o ConnectTimeout=20 \
              -p "${ROUTER_SSH_PORT:-22}" \
              "${ROUTER_SSH_USER}@${ROUTER_HOST}"

          # 確認通道真的通了，並印出對外 IP（只印前兩段，不外洩完整住家 IP）
          EXIT_IP=$(curl -s --max-time 20 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org)
          if [ -z "$EXIT_IP" ]; then
            echo "::error::SOCKS5 通道建立了但無法連外"
            exit 1
          fi
          echo "通道對外 IP: $(echo "$EXIT_IP" | cut -d. -f1-2).x.x"
          echo "CRUISEDIRECT_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"

      - name: 擷取
        id: scrape
        # 全部來源都失敗時 CLI 會回傳 1；先不要讓工作中斷，
        # 這樣仍會 commit 既有資料，最後再把工作標成失敗。
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.sources }}" ]; then
            python -m cruise_deals --sources "${{ inputs.sources }}"
          else
            python -m cruise_deals
          fi

      - name: 上傳除錯產物
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Commit 結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "資料沒有變動，略過 commit"
          else
            COUNT=$(python -c "import json;print(json.load(open('data/deals.json'))['count'])")
            git commit -m "資料更新：${COUNT} 筆航次 ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: 全部來源皆失敗時讓工作失敗
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::所有來源都擷取失敗，請檢查上方日誌與除錯產物"
          exit 1
